
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dongxing Xin's personal home page.">
  <meta name="author" content="Dongxing Xin">
  <meta name="theme-color" content="#000000">
  <title>Dongxing Xin</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      --color-fg: #000;
      --color-bg: #fff;
      --color-muted: #666;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-fg: #fff;
        --color-bg: #000;
        --color-muted: #999;
      }
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 2rem;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.4;
      color: var(--color-fg);
      background-color: var(--color-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 22vh;
    }

    main {
      text-align: center;
      max-width: 20rem;
    }

    .avatar {
      width: 16rem;
      height: 16rem;
      object-fit: cover;
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 0.875rem;
      margin: 0.75rem 0 0;
      color: var(--color-muted);
      letter-spacing: 0.1em;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .social-link {
      color: var(--color-fg);
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .social-link:hover {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <main>
    <img
      id="avatar"
      class="avatar"
      src="./placeholder.png"
      alt="Dongxing Xin"
      width="160"
      height="160"
    >
    <h1>Dongxing Xin</h1>
    <p class="tagline">👨🏻‍💻 + 🚴 + 🐈 + 🍺 + 📷</p>
    <nav class="social-links" aria-label="Social links">
      <a
        class="social-link"
        href="https://www.linkedin.com/in/xindongxing/"
        target="_blank"
        rel="noopener noreferrer"
      >Linked In</a>
      <a
        class="social-link"
        id="email-link"
        href="#"
      >Email</a>
    </nav>
  </main>

  <script>
    (() => {
      const avatars = [
        "./noritakes/1.png",
        "./noritakes/2.png",
        "./noritakes/3.png",
        "./noritakes/4.png",
        "./noritakes/5.png",
        "./noritakes/6.jpg",
        "./noritakes/7.jpg",
        "./noritakes/8.jpg",
        "./noritakes/9.jpg",
        "./noritakes/10.jpg",
        "./noritakes/11.jpg",
        "./noritakes/12.jpg",
        "./noritakes/13.jpg",
        "./noritakes/14.png",
        "./noritakes/15.png",
        "./noritakes/16.png",
        "./noritakes/17.jpg",
        "./noritakes/18.jpg",
      ];

      const setRandomAvatar = () => {
        const img = document.getElementById("avatar");
        const randomIndex = Math.floor(Math.random() * avatars.length);
        img.src = avatars[randomIndex];
      };

      document.addEventListener("DOMContentLoaded", setRandomAvatar);

      const emailLink = document.getElementById("email-link");
      const encoded = "eGluZG9uZ3hpbmdAb3V0bG9vay5jb20=";
      emailLink.href = "mailto:" + atob(encoded);
    })();
  </script>
</body>
</html>
